<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Análises Esportivas</title>
    <style>
        /* Reset e Estilos Globais (Estilo SofaScore) */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #121212; color: #ffffff; padding-bottom: 60px; /* Espaço para o menu inferior */ }
        
        /* Cabeçalho */
        header { background-color: #1e1e1e; padding: 15px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.5); display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 18px; color: #00e676; font-weight: bold; }
        .icon-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }

        /* Abas de Filtro (Ao Vivo, Hoje, etc) */
        .tabs { display: flex; overflow-x: auto; background-color: #1e1e1e; padding: 10px 15px; gap: 15px; border-bottom: 1px solid #333; }
        .tabs span { font-size: 14px; color: #aaa; white-space: nowrap; cursor: pointer; padding-bottom: 5px; }
        .tabs span.active { color: #00e676; border-bottom: 2px solid #00e676; font-weight: bold; }

        /* Lista de Jogos */
        .match-list { padding: 10px 0; }
        .league-title { font-size: 12px; color: #888; padding: 10px 15px; text-transform: uppercase; font-weight: bold; background-color: #1a1a1a; }
        
        .match-card { background-color: #1e1e1e; margin: 5px 10px; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: background 0.2s; }
        .match-card:active { background-color: #2a2a2a; }
        
        .match-header { display: flex; justify-content: space-between; font-size: 11px; color: #888; }
        .match-status { color: #00e676; font-weight: bold; }
        
        .teams { display: flex; flex-direction: column; gap: 8px; }
        .team-row { display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
        .team-name { font-weight: 500; }
        .score { font-weight: bold; font-size: 16px; background-color: #333; padding: 2px 8px; border-radius: 4px; }
        
        /* Menu Inferior (Navegação) */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #1e1e1e; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; z-index: 200; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #888; cursor: pointer; gap: 4px; }
        .nav-item.active { color: #00e676; }
        .nav-item span { font-size: 20px; }
    </style>
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <h1>Análises Esportivas</h1>
        <button class="icon-btn">🔍</button>
    </header>

    <!-- Abas de Filtro -->
    <div class="tabs">
        <span class="active">AO VIVO</span>
        <span>HOJE</span>
        <span>AMANHÃ</span>
        <span>FAVORITOS</span>
    </div>

    <!-- Lista de Jogos -->
    <div class="match-list">
        <!-- Campeonato -->
        <div class="league-title">Brasileirão Série A</div>
        
        <!-- Jogo 1 -->
        <div class="match-card">
            <div class="match-header">
                <span>45' - 1º Tempo</span>
                <span class="match-status">AO VIVO</span>
            </div>
            <div class="teams">
                <div class="team-row">
                    <span class="team-name">Flamengo</span>
                    <span class="score">2</span>
                </div>
                <div class="team-row">
                    <span class="team-name">Palmeiras</span>
                    <span class="score">1</span>
                </div>
            </div>
        </div>

        <!-- Jogo 2 -->
        <div class="match-card">
            <div class="match-header">
                <span>Hoje, 18:30</span>
                <span class="match-status" style="color: #aaa;">AGENDADO</span>
            </div>
            <div class="teams">
                <div class="team-row">
                    <span class="team-name">São Paulo</span>
                    <span class="score">-</span>
                </div>
                <div class="team-row">
                    <span class="team-name">Corinthians</span>
                    <span class="score">-</span>
                </div>
            </div>
        </div>

        <!-- Outro Campeonato -->
        <div class="league-title">Champions League</div>
        
        <!-- Jogo 3 -->
        <div class="match-card">
            <div class="match-header">
                <span>Hoje, 16:00</span>
                <span class="match-status" style="color: #aaa;">AGENDADO</span>
            </div>
            <div class="teams">
                <div class="team-row">
                    <span class="team-name">Real Madrid</span>
                    <span class="score">-</span>
                </div>
                <div class="team-row">
                    <span class="team-name">Manchester City</span>
                    <span class="score">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Menu Inferior -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <span>⚽</span>
            Jogos
        </div>
        <div class="nav-item">
            <span>📊</span>
            Estatísticas
        </div>
        <div class="nav-item">
            <span>👤</span>
            Perfil
        </div>
    </div>

</body>
  </html>

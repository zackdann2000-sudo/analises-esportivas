<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>Análises Esportivas</title>
  <script>
    try {
      if (localStorage.getItem('temaClaro') === 'true') {
        document.documentElement.classList.add('light-mode');
      }
    } catch (_) {}
  </script>
  <style>
    :root{--bg:#121212;--card:#1e1e1e;--text:#fff;--muted:#aaa;--border:#333;--header:#1e1e1e;--league:#1a1a1a;--green:#00e676;--danger:#ff5252}
    html.light-mode{--bg:#f5f5f5;--card:#fff;--text:#121212;--muted:#666;--border:#ddd;--header:#fff;--league:#eee}
    *{box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{margin:0;background:var(--bg);color:var(--text);padding-bottom:76px;transition:background .2s,color .2s}
    button,input{font:inherit}
    button{cursor:pointer}
    header{position:sticky;top:0;z-index:100;background:var(--header);padding:14px;border-bottom:1px solid var(--border)}
    .header-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
    h1{font-size:18px;margin:0;color:var(--green)}
    .header-actions{display:flex;gap:10px}
    .icon-btn{border:0;background:transparent;color:var(--text);font-size:21px;padding:4px}
    .busca-container{display:none;margin-top:12px}
    .busca-container.open{display:block}
    .busca-container input{width:100%;padding:11px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text);outline-offset:2px}
    .tabs{display:flex;overflow-x:auto;gap:16px;padding:12px 15px;background:var(--header);border-bottom:1px solid var(--border);scrollbar-width:thin}
    .tab{border:0;border-bottom:2px solid transparent;padding:0 0 6px;background:transparent;color:var(--muted);white-space:nowrap;font-size:13px}
    .tab.active{color:var(--green);border-color:var(--green);font-weight:700}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;color:var(--muted);font-size:12px}
    .small-btn{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text)}
    .match-list{padding:4px 0}
    .league-title{font-size:12px;color:var(--muted);padding:11px 15px;text-transform:uppercase;font-weight:700;background:var(--league);margin-top:9px}
    .match-card{background:var(--card);margin:7px 10px;border-radius:9px;padding:13px;border:1px solid var(--border);cursor:pointer}
    .match-card:active{opacity:.85}
    .match-header{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted);margin-bottom:12px}
    .match-status{font-weight:700}
    .status-live{color:var(--green)}.status-break{color:#ffb300}.status-finished{color:var(--muted)}.status-scheduled{color:#42a5f5}
    .teams{display:flex;flex-direction:column;gap:10px}
    .team-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
    .team-name{font-weight:500;overflow-wrap:anywhere}
    .team-link{padding:0;border:0;background:none;color:inherit;text-align:left;text-decoration:underline;text-decoration-color:transparent}
    .team-link:hover{text-decoration-color:currentColor}
    .right-side{display:flex;align-items:center;gap:9px;flex-shrink:0}
    .score{font-weight:800;font-size:16px;background:var(--border);padding:3px 8px;border-radius:5px;min-width:28px;text-align:center}
    .fav-btn{border:0;background:transparent;color:#777;font-size:20px;padding:0 2px;line-height:1}
    .fav-btn.active{color:#ffca28}
    .loading,.empty-message{text-align:center;padding:28px 18px;color:var(--muted)}
    .error{color:var(--danger)}
    .bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:var(--header);display:flex;justify-content:space-around;padding:9px 0 calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--border);z-index:200}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--muted);font-size:10px;min-width:70px}
    .nav-item span{font-size:20px}.nav-item.active{color:var(--green)}
    .modal{display:none;position:fixed;inset:0;background:#000b;z-index:300;justify-content:center;align-items:center;padding:18px}
    .modal.open{display:flex}
    .modal-content{background:var(--card);width:100%;max-width:480px;border-radius:12px;padding:18px;max-height:82vh;overflow:auto;border:1px solid var(--border)}
    .modal-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}
    .modal-header h2{font-size:16px;color:var(--green);margin:0}
    .close-btn{border:0;background:transparent;color:var(--text);font-size:26px}
    .stat-row,.historico-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
    .stat-label{color:var(--muted)}.stat-value{text-align:right;font-weight:650;overflow-wrap:anywhere}
    .match-summary{text-align:center;margin-bottom:18px}.match-summary h3{font-size:16px;margin:0 0 6px}.match-summary p{font-size:24px;font-weight:800;color:var(--green);margin:0}
    @media(min-width:700px){.match-list{max-width:850px;margin:auto}.tabs,.toolbar{padding-left:max(15px,calc((100% - 820px)/2));padding-right:max(15px,calc((100% - 820px)/2))}}
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>Análises Esportivas</h1>
      <div class="header-actions">
        <button type="button" class="icon-btn" id="theme-btn" aria-label="Alternar tema" title="Alternar tema">☀️</button>
        <button type="button" class="icon-btn" id="search-btn" aria-label="Buscar time" title="Buscar time">🔍</button>
      </div>
    </div>
    <div class="busca-container" id="busca-container">
      <input type="search" id="input-busca" placeholder="Buscar time ou liga..." autocomplete="off">
    </div>
  </header>

  <nav class="tabs" aria-label="Filtros de partidas">
    <button class="tab active" data-tab="AO VIVO">AO VIVO</button>
    <button class="tab" data-tab="HOJE">HOJE</button>
    <button class="tab" data-tab="AMANHA">AMANHÃ</button>
    <button class="tab" data-tab="FINALIZADOS">FINALIZADOS</button>
    <button class="tab" data-tab="FAVORITOS">FAVORITOS</button>
  </nav>

  <div class="toolbar">
    <span id="atualizacao">Aguardando dados...</span>
    <button type="button" class="small-btn" id="refresh-btn">↻ Atualizar</button>
  </div>
  <main class="match-list" id="lista-jogos" aria-live="polite">
    <div class="loading">Carregando jogos...</div>
  </main>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <button type="button" class="nav-item active" data-page="jogos"><span>⚽</span>Jogos</button>
    <button type="button" class="nav-item" data-page="estatisticas"><span>📊</span>Estatísticas</button>
    <button type="button" class="nav-item" data-page="perfil"><span>👤</span>Perfil</button>
  </nav>

  <div class="modal" id="modal-detalhes" role="dialog" aria-modal="true" aria-labelledby="titulo-detalhes">
    <div class="modal-content">
      <div class="modal-header"><h2 id="titulo-detalhes">Detalhes da partida</h2><button type="button" class="close-btn" data-close="modal-detalhes" aria-label="Fechar">&times;</button></div>
      <div id="conteudo-modal"><div class="loading">Carregando...</div></div>
    </div>
  </div>
  <div class="modal" id="modal-time" role="dialog" aria-modal="true" aria-labelledby="titulo-time">
    <div class="modal-content">
      <div class="modal-header"><h2 id="titulo-time">Últimos jogos</h2><button type="button" class="close-btn" data-close="modal-time" aria-label="Fechar">&times;</button></div>
      <div id="conteudo-time"><div class="loading">Carregando...</div></div>
    </div>
  </div>

  <script>
    'use strict';
    const API = {
      jogos: '/api/jogos',
      jogo: id => `/api/jogo/${encodeURIComponent(id)}`,
      historico: id => `/api/time/${encodeURIComponent(id)}/jogos`
    };
    let todosOsJogos = [];
    let abaAtual = 'AO VIVO';
    let favoritos = [];
    let termoBusca = '';
    let carregando = false;
    let ultimoFoco = null;

    const $ = id => document.getElementById(id);
    const texto = valor => valor === null || valor === undefined || valor === '' ? '—' : String(valor);
    const normalizar = valor => String(valor ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('pt-BR').trim();
    const escapar = valor => String(valor ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const idValido = id => id !== null && id !== undefined && String(id).trim() !== '';
    function lerFavoritos() {
      try {
        const salvo = JSON.parse(localStorage.getItem('favoritosEsportes') || '[]');
        favoritos = Array.isArray(salvo) ? salvo.map(String) : [];
      } catch (_) { favoritos = []; }
    }
    function salvarFavoritos() {
      try { localStorage.setItem('favoritosEsportes', JSON.stringify(favoritos)); } catch (_) {}
    }
    function chaveTime(id, nome) {
      return idValido(id) ? `id:${id}` : `nome:${normalizar(nome)}`;
    }
    function isFavorito(jogo) {
      return favoritos.includes(chaveTime(jogo.timeCasaId, jogo.timeCasa)) ||
             favoritos.includes(chaveTime(jogo.timeForaId, jogo.timeFora));
    }
    function toggleTema() {
      const claro = document.documentElement.classList.toggle('light-mode');
      $('theme-btn').textContent = claro ? '🌙' : '☀️';
      try { localStorage.setItem('temaClaro', String(claro)); } catch (_) {}
    }
    function formatarData(valor, comHora = true) {
      if (!valor) return 'Data não informada';
      const data = new Date(valor);
      if (Number.isNaN(data.getTime())) return 'Data inválida';
      return data.toLocaleString('pt-BR', {
        timeZone: 'America/Sao_Paulo',
        day: '2-digit', month: '2-digit',
        ...(comHora ? {hour:'2-digit', minute:'2-digit'} : {})
      });
    }
    function dataLocalChave(data) {
      if (!(data instanceof Date) || Number.isNaN(data.getTime())) return '';
      return new Intl.DateTimeFormat('en-CA', {timeZone:'America/Sao_Paulo', year:'numeric', month:'2-digit', day:'2-digit'}).format(data);
    }
    function statusClasse(jogo) {
      const s = normalizar(jogo.statusOriginal);
      if (['in_play','live','1h','2h','extra_time','penalty_shootout'].includes(s)) return 'status-live';
      if (['paused','half_time','break','ht'].includes(s)) return 'status-break';
      if (['finished','ft','aet','after_penalties'].includes(s)) return 'status-finished';
      return 'status-scheduled';
    }
    function ehAoVivo(jogo) {
      const s = normalizar(jogo.statusOriginal);
      const traduzido = normalizar(jogo.statusTraduzido);
      return ['in_play','paused','live','1h','2h','extra_time','penalty_shootout','half_time','ht'].includes(s) ||
        ['ao vivo','intervalo'].includes(traduzido);
    }
    function ehFinalizado(jogo) {
      const s = normalizar(jogo.statusOriginal);
      return ['finished','ft','aet','after_penalties'].includes(s) || normalizar(jogo.statusTraduzido) === 'finalizado';
    }
    function filtrarJogos() {
      const hoje = dataLocalChave(new Date());
      const amanhaDate = new Date();
      amanhaDate.setDate(amanhaDate.getDate() + 1);
      const amanha = dataLocalChave(amanhaDate);
      return todosOsJogos.filter(j => {
        const casa = normalizar(j.timeCasa), fora = normalizar(j.timeFora), liga = normalizar(j.liga);
        if (termoBusca && !casa.includes(termoBusca) && !fora.includes(termoBusca) && !liga.includes(termoBusca)) return false;
        const data = j.data ? new Date(j.data) : null;
        if (abaAtual === 'AO VIVO') return ehAoVivo(j);
        if (abaAtual === 'HOJE') return data && !Number.isNaN(data.getTime()) && dataLocalChave(data) === hoje;
        if (abaAtual === 'AMANHA') return data && !Number.isNaN(data.getTime()) && dataLocalChave(data) === amanha;
        if (abaAtual === 'FINALIZADOS') return ehFinalizado(j);
        if (abaAtual === 'FAVORITOS') return isFavorito(j);
        return true;
      });
    }
    function renderizarJogos() {
      const container = $('lista-jogos');
      const jogos = filtrarJogos();
      container.replaceChildren();
      if (!jogos.length) {
        const msg = document.createElement('div');
        msg.className = 'empty-message';
        msg.textContent = termoBusca ? `Nenhum jogo encontrado para "${termoBusca}".` : `Nenhum jogo encontrado na aba "${abaAtual}".`;
        container.appendChild(msg);
        return;
      }
      const ligas = new Map();
      jogos.forEach(j => {
        const liga = texto(j.liga);
        if (!ligas.has(liga)) ligas.set(liga, []);
        ligas.get(liga).push(j);
      });
      for (const [nomeLiga, partidas] of ligas) {
        const titulo = document.createElement('div');
        titulo.className = 'league-title';
        titulo.textContent = nomeLiga;
        container.appendChild(titulo);
        partidas.forEach(j => {
          const card = document.createElement('article');
          card.className = 'match-card';
          const status = texto(j.statusTraduzido || j.statusOriginal || 'Agendado');
          const fav = isFavorito(j);
          card.innerHTML = `
            <div class="match-header"><span>${escapar(formatarData(j.data))}</span><span class="match-status ${statusClasse(j)}">${escapar(status)}</span></div>
            <div class="teams">
              <div class="team-row">
                <button type="button" class="team-name team-link" data-team-id="${escapar(texto(j.timeCasaId))}" data-team-name="${escapar(texto(j.timeCasa))}">${escapar(texto(j.timeCasa))}</button>
                <div class="right-side"><button type="button" class="fav-btn ${fav?'active':''}" data-fav-id="${escapar(chaveTime(j.timeCasaId,j.timeCasa))}" aria-label="${fav?'Remover':'Adicionar'} ${escapar(texto(j.timeCasa))} ${fav?'dos':'aos'} favoritos" title="Favoritar time">${fav?'★':'☆'}</button><span class="score">${escapar(texto(j.golsCasa))}</span></div>
              </div>
              <div class="team-row">
                <button type="button" class="team-name team-link" data-team-id="${escapar(texto(j.timeForaId))}" data-team-name="${escapar(texto(j.timeFora))}">${escapar(texto(j.timeFora))}</button>
                <div class="right-side"><button type="button" class="fav-btn ${fav?'active':''}" data-fav-id="${escapar(chaveTime(j.timeForaId,j.timeFora))}" aria-label="${fav?'Remover':'Adicionar'} ${escapar(texto(j.timeFora))} ${fav?'dos':'aos'} favoritos" title="Favoritar time">${fav?'★':'☆'}</button><span class="score">${escapar(texto(j.golsFora))}</span></div>
              </div>
            </div>`;
          card.addEventListener('click', () => abrirDetalhes(j.id));
          card.querySelectorAll('[data-fav-id]').forEach(btn => btn.addEventListener('click', e => {
            e.stopPropagation();
            const key = btn.dataset.favId;
            favoritos = favoritos.includes(key) ? favoritos.filter(x => x !== key) : [...favoritos, key];
            salvarFavoritos(); renderizarJogos();
          }));
          card.querySelectorAll('[data-team-id]').forEach(btn => btn.addEventListener('click', e => {
            e.stopPropagation(); abrirTime(btn.dataset.teamId, btn.dataset.teamName);
          }));
          container.appendChild(card);
        });
      }
    }
    async function requisitarJson(url) {
      const resposta = await fetch(url, {headers:{'Accept':'application/json'}, cache:'no-store'});
      const tipo = resposta.headers.get('content-type') || '';
      if (!resposta.ok) throw new Error(`Servidor respondeu HTTP ${resposta.status}`);
      if (!tipo.includes('application/json')) throw new Error('O servidor não retornou JSON. Verifique a rota da API.');
      return resposta.json();
    }
    async function carregarJogos() {
      if (carregando) return;
      carregando = true;
      $('refresh-btn').disabled = true;
      $('refresh-btn').textContent = 'Carregando…';
      if (!todosOsJogos.length) $('lista-jogos').innerHTML = '<div class="loading">Carregando jogos…<br><small>O servidor gratuito pode levar alguns segundos para iniciar.</small></div>';
      try {
        const dados = await requisitarJson(API.jogos);
        if (dados && !Array.isArray(dados) && dados.erro) throw new Error(dados.detalhe || dados.erro);
        const lista = Array.isArray(dados) ? dados : (Array.isArray(dados.jogos) ? dados.jogos : null);
        if (!lista) throw new Error('Formato inesperado em /api/jogos. A rota deve retornar uma lista ou { "jogos": [...] }.');
        todosOsJogos = lista.filter(j => j && typeof j === 'object').map(j => ({
          ...j,
          timeCasa: texto(j.timeCasa || j.homeTeam || j.home_team),
          timeFora: texto(j.timeFora || j.awayTeam || j.away_team),
          liga: texto(j.liga || j.competition || j.league),
          statusOriginal: j.statusOriginal ?? j.status ?? '',
          statusTraduzido: j.statusTraduzido ?? j.status_text ?? j.status ?? 'Agendado',
          data: j.data ?? j.utcDate ?? j.date ?? null,
          golsCasa: j.golsCasa ?? j.homeScore ?? j.score?.home ?? null,
          golsFora: j.golsFora ?? j.awayScore ?? j.score?.away ?? null
        }));
        renderizarJogos();
        $('atualizacao').textContent = `Atualizado às ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;
      } catch (e) {
        $('lista-jogos').innerHTML = `<div class="loading error">Não foi possível carregar os jogos.<br><small>${escapar(e.message)}</small><br><br><button type="button" class="small-btn" id="retry-btn">Tentar novamente</button></div>`;
        $('retry-btn')?.addEventListener('click', carregarJogos);
        $('atualizacao').textContent = 'Falha na atualização';
      } finally {
        carregando = false;
        $('refresh-btn').disabled = false;
        $('refresh-btn').textContent = '↻ Atualizar';
      }
    }
    function mudarAba(aba) {
      abaAtual = aba;
      document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === aba));
      renderizarJogos();
    }
    function abrirModal(id) {
      ultimoFoco = document.activeElement;
      $(id).classList.add('open');
      $(id).querySelector('.close-btn')?.focus();
    }
    function fecharModal(id) {
      $(id).classList.remove('open');
      ultimoFoco?.focus?.();
    }
    async function abrirDetalhes(id) {
      if (!idValido(id)) return;
      abrirModal('modal-detalhes');
      $('conteudo-modal').innerHTML = '<div class="loading">Carregando detalhes…</div>';
      try {
        const stats = await requisitarJson(API.jogo(id));
        if (stats.erro) throw new Error(stats.detalhe || stats.erro);
        $('conteudo-modal').innerHTML = `
          <div class="match-summary"><h3>${escapar(texto(stats.timeCasa))} x ${escapar(texto(stats.timeFora))}</h3><p>${escapar(texto(stats.golsCasa))} - ${escapar(texto(stats.golsFora))}</p></div>
          ${linha('Árbitro',stats.arbitro)}${linha('Estádio',stats.estadio)}${linha('Público',stats.publico)}
          ${linha('Cartões (casa)',stats.cartoesCasa)}${linha('Cartões (fora)',stats.cartoesFora)}
          ${linha('Substituições (casa)',stats.subsCasa)}${linha('Substituições (fora)',stats.subsFora)}
          ${linha('Finalizações (casa)',stats.finalizacoesCasa ?? stats.chutesCasa)}${linha('Finalizações (fora)',stats.finalizacoesFora ?? stats.chutesFora)}
          ${linha('Escanteios (casa)',stats.escanteiosCasa)}${linha('Escanteios (fora)',stats.escanteiosFora)}`;
      } catch (e) {
        $('conteudo-modal').innerHTML = `<div class="loading error">${escapar(e.message || 'Erro ao carregar detalhes.')}</div>`;
      }

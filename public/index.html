<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Bloqueia o cache para o celular sempre baixar a versão nova -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Análises Esportivas</title>
    
    <!-- SCRIPT DE TEMA NO TOPO PARA NÃO PISCAR -->
    <script>
        try {
            if (localStorage.getItem('temaClaro') === 'true') {
                document.documentElement.classList.add('light-mode');
            }
        } catch (e) { console.warn('LocalStorage bloqueado'); }
    </script>

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --header-bg: #1e1e1e;
            --league-bg: #1a1a1a;
        }

        html.light-mode {
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-color: #121212;
            --text-muted: #666666;
            --border-color: #dddddd;
            --header-bg: #ffffff;
            --league-bg: #eeeeee;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 60px; transition: background 0.3s, color 0.3s; }
        header { background-color: var(--header-bg); padding: 15px; position: sticky; top: 0; z-index: 100; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--border-color); }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 18px; color: #00e676; font-weight: bold; }
        .icon-btn { background: none; border: none; color: var(--text-color); font-size: 20px; cursor: pointer; }
        
        .busca-container { display: none; }
        .busca-container input { width: 100%; padding: 10px 15px; border-radius: 20px; border: 1px solid var(--border-color); background-color: var(--bg-color); color: var(--text-color); font-size: 14px; outline: none; }
        .busca-container input::placeholder { color: var(--text-muted); }

        .tabs { display: flex; overflow-x: auto; background-color: var(--header-bg); padding: 10px 15px; gap: 15px; border-bottom: 1px solid var(--border-color); }
        .tabs span { font-size: 14px; color: var(--text-muted); white-space: nowrap; cursor: pointer; padding-bottom: 5px; }
        .tabs span.active { color: #00e676; border-bottom: 2px solid #00e676; font-weight: bold; }
        
        .match-list { padding: 10px 0; }
        .league-title { font-size: 12px; color: var(--text-muted); padding: 10px 15px; text-transform: uppercase; font-weight: bold; background-color: var(--league-bg); margin-top: 10px; }
        
        .match-card { background-color: var(--card-bg); margin: 5px 10px; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; position: relative; border: 1px solid var(--border-color); }
        .match-card:active { opacity: 0.8; }
        .match-header { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); }
        .match-status { font-weight: bold; }
        .status-AO-VIVO { color: #00e676; }
        .status-INTERVALO { color: #ffb300; }
        .status-FINALIZADO { color: var(--text-muted); }
        .status-AGENDADO { color: #42a5f5; }
        
        .teams { display: flex; flex-direction: column; gap: 8px; }
        .team-row { display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
        .team-name { font-weight: 500; }
        .team-clickable { cursor: pointer; text-decoration: underline; text-decoration-color: transparent; transition: color 0.2s; }
        .team-clickable:hover { color: #42a5f5; text-decoration-color: #42a5f5; }
        .score { font-weight: bold; font-size: 16px; background-color: var(--border-color); padding: 2px 8px; border-radius: 4px; }
        
        .fav-btn { cursor: pointer; font-size: 18px; color: #666; transition: color 0.2s; }
        .fav-btn.active { color: #ffca28; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background-color: var(--header-bg); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--border-color); z-index: 200; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--text-muted); cursor: pointer; gap: 4px; }
        .nav-item.active { color: #00e676; }
        .nav-item span { font-size: 20px; }
        
        .loading { text-align: center; padding: 20px; color: var(--text-muted); }
        .empty-message { text-align: center; padding: 40px 20px; color: var(--text-muted); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); z-index: 300; justify-content: center; align-items: center; }
        .modal-content { background-color: var(--card-bg); width: 90%; max-width: 400px; border-radius: 12px; padding: 20px; position: relative; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .modal-header h2 { font-size: 16px; color: #00e676; }
        .close-btn { background: none; border: none; color: var(--text-color); font-size: 24px; cursor: pointer; }
        .stat-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        .stat-label { color: var(--text-muted); }
        .stat-value { font-weight: bold; }
        .historico-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-color); font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>Análises Esportivas</h1>
            <div style="display: flex; gap: 15px;">
                <button type="button" class="icon-btn" id="theme-btn" onclick="toggleTheme(event)">☀️</button>
                <button type="button" class="icon-btn" onclick="toggleBusca()">🔍</button>
            </div>
        </div>
        <div class="busca-container" id="busca-container">
            <input type="text" id="input-busca" placeholder="Buscar time... (ex: Flamengo)" oninput="filtrarPorBusca()">
        </div>
    </header>

    <div class="tabs">
        <span class="active" onclick="mudarAba('AO VIVO', this)">AO VIVO</span>
        <span onclick="mudarAba('HOJE', this)">HOJE</span>
        <span onclick="mudarAba('AMANHA', this)">AMANHÃ</span>
        <span onclick="mudarAba('FINALIZADOS', this)">FINALIZADOS</span>
        <span onclick="mudarAba('FAVORITOS', this)">FAVORITOS</span>
    </div>

    <div class="match-list" id="lista-jogos">
        <div class="loading">Carregando jogos...</div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active"><span>⚽</span>Jogos</div>
        <div class="nav-item"><span>📊</span>Estatísticas</div>
        <div class="nav-item"><span>👤</span>Perfil</div>
    </div>

    <!-- Modal de Detalhes do Jogo -->
    <div class="modal" id="modal-detalhes">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Detalhes da Partida</h2>
                <button type="button" class="close-btn" onclick="fecharModal('modal-detalhes')">&times;</button>
            </div>
            <div id="conteudo-modal"><div class="loading">Carregando...</div></div>
        </div>
    </div>

    <!-- Modal de Histórico do Time -->
    <div class="modal" id="modal-time">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="titulo-time">Últimos Jogos</h2>
                <button type="button" class="close-btn" onclick="fecharModal('modal-time')">&times;</button>
            </div>
            <div id="conteudo-time"><div class="loading">Carregando...</div></div>
        </div>
    </div>

    <script>
        let todosOsJogos = [];
        let abaAtual = 'AO VIVO';
        let favoritos = [];
        let termoBusca = '';

        try { favoritos = JSON.parse(localStorage.getItem('favoritosEsportes')) || []; } catch(e) {}

        // Inicializa
        window.addEventListener('DOMContentLoaded', () => {
            const isLight = document.documentElement.classList.contains('light-mode');
            document.getElementById('theme-btn').textContent = isLight ? '🌙' : '☀️';
            carregarJogos();
        });

        function toggleTheme(event) {
            event.preventDefault();
            const isLight = document.documentElement.classList.toggle('light-mode');
            document.getElementById('theme-btn').textContent = isLight ? '🌙' : '☀️';
            try { localStorage.setItem('temaClaro', isLight ? 'true' : 'false'); } catch(e) {}
        }

        function toggleBusca() {
            const container = document.getElementById('busca-container');
            const input = document.getElementById('input-busca');
            if (container.style.display === 'none' || container.style.display === '') {
                container.style.display = 'block';
                input.focus();
            } else {
                container.style.display = 'none';
                input.value = '';
                termoBusca = '';
                renderizarJogos();
            }
        }

        function filtrarPorBusca() {
            termoBusca = document.getElementById('input-busca').value.toLowerCase();
            renderizarJogos();
        }

        function toggleFavorito(event, timeCasa, timeFora) {
            event.stopPropagation();
            try {
                const indexCasa = favoritos.indexOf(timeCasa);
                const indexFora = favoritos.indexOf(timeFora);
                if (indexCasa > -1) favoritos.splice(indexCasa, 1);
                else if (indexFora > -1) favoritos.splice(indexFora, 1);
                else favoritos.push(timeCasa, timeFora);
                localStorage.setItem('favoritosEsportes', JSON.stringify(favoritos));
                renderizarJogos();
            } catch (e) {}
        }

        async function carregarJogos() {
            try {
                const resposta = await fetch('/api/jogos');
                const dados = await resposta.json();
                if (dados.erro) {
                    document.getElementById('lista-jogos').innerHTML = `<div class="loading" style="color: #ff5252;">Erro: ${dados.detalhe || dados.erro}</div>`;
                    return;
                }
                todosOsJogos = dados;
                renderizarJogos();
            } catch (erro) {
                document.getElementById('lista-jogos').innerHTML = '<div class="loading" style="color: #ff5252;">Erro ao conectar.</div>';
            }
        }

        function mudarAba(novaAba, elemento) {
            abaAtual = novaAba;
            document.querySelectorAll('.tabs span').forEach(span => span.classList.remove('active'));
            elemento.classList.add('active');
            renderizarJogos();
        }

        function renderizarJogos() {
            const container = document.getElementById('lista-jogos');
            container.innerHTML = '';

            const agora = new Date();
            const dataHojeStr = agora.toLocaleDateString('pt-BR', { timeZone: 'America/Sao_Paulo' });
            const amanha = new Date(agora);
            amanha.setDate(amanha.getDate() + 1);
            const dataAmanhaStr = amanha.toLocaleDateString('pt-BR', { timeZone: 'America/Sao_Paulo' });

            const jogosFiltrados = todosOsJogos.filter(jogo => {
                if (termoBusca) {
                    if (!jogo.timeCasa.toLowerCase().includes(termoBusca) && !jogo.timeFora.toLowerCase().includes(termoBusca)) return false;
                }

                const dataJogo = new Date(jogo.data);
                const dataJogoStr = dataJogo.toLocaleDateString('pt-BR', { timeZone: 'America/Sao_Paulo' });
                
                if (abaAtual === 'AO VIVO') return jogo.statusOriginal === 'IN_PLAY' || jogo.statusOriginal === 'PAUSED';
                if (abaAtual === 'HOJE') return dataJogoStr === dataHojeStr;
                if (abaAtual === 'AMANHA') return dataJogoStr === dataAmanhaStr;
                if (abaAtual === 'FINALIZADOS') return jogo.statusOriginal === 'FINISHED';
                if (abaAtual === 'FAVORITOS') return favoritos.includes(jogo.timeCasa) || favoritos.includes(jogo.timeFora);
                return false;
            });

            if (jogosFiltrados.length === 0) {
                const msg = termoBusca ? `Nenhum jogo encontrado para "${termoBusca}".` : `Nenhum jogo na aba "${abaAtual}". Se for "AO VIVO", pode não haver jogos agora.`;
                container.innerHTML = `<div class="empty-message">${msg}</div>`;
                return;
            }

            const ligas = {};
            jogosFiltrados.forEach(jogo => {
                if (!ligas[jogo.liga]) ligas[jogo.liga] = [];
                ligas[jogo.liga].push(jogo);
            });

            for (const [nomeLiga, listaJogos] of Object.entries(ligas)) {
                const tituloLiga = document.createElement('div');
                tituloLiga.className = 'league-title';
                tituloLiga.textContent = nomeLiga;
                container.appendChild(tituloLiga);

                listaJogos.forEach(jogo => {
                    const dataFormatada = new Date(jogo.data).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' });
                    const placarCasa = jogo.golsCasa !== null ? jogo.golsCasa : '-';
                    const placarFora = jogo.golsFora !== null ? jogo.golsFora : '-';
                    const classeStatus = 'status-' + jogo.statusTraduzido.replace(' ', '-');
                    
                    const isFav = favoritos.includes(jogo.timeCasa) || favoritos.includes(jogo.timeFora);
                    const estrela = isFav ? '★' : '☆';
                    const classeEstrela = isFav ? 'fav-btn active' : 'fav-btn';

                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.onclick = () => abrirDetalhes(jogo.id, jogo.timeCasa, jogo.timeFora);
                    card.innerHTML = `
                        <div class="match-header">
                            <span>${dataFormatada}</span>
                            <span class="match-status ${classeStatus}">${jogo.statusTraduzido}</span>
                        </div>
                        <div class="teams">
                            <div class="team-row">
                                <span class="team-name team-clickable" onclick="abrirTime(event, ${jogo.timeCasaId}, '${jogo.timeCasa}')">${jogo.timeCasa}</span>
                                <div style="display: flex; gap: 10px; align-items: center;">
                                    <span class="${classeEstrela}" onclick="toggleFavorito(event, '${jogo.timeCasa}', '${jogo.timeFora}')">${estrela}</span>
                                    <span class="score">${placarCasa}</span>
                                </div>
                            </div>
                            <div class="team-row">
                                <span class="team-name team-clickable" onclick="abrirTime(event, ${jogo.timeForaId}, '${jogo.timeFora}')">${jogo.timeFora}</span>
                                <div style="display: flex; gap: 10px; align-items: center;">
                                    <span class="${classeEstrela}" onclick="toggleFavorito(event, '${jogo.timeCasa}', '${jogo.timeFora}')">${estrela}</span>
                                    <span class="score">${placarFora}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        async function abrirDetalhes(idJogo, timeCasa, timeFora) {
            const modal = document.getElementById('modal-detalhes');
            const conteudo = document.getElementById('conteudo-modal');
            modal.style.display = 'flex';
            conteudo.innerHTML = '<div class="loading">Carregando...</div>';
            try {
                const resposta = await fetch(`/api/jogo/${idJogo}`);
                const stats = await resposta.json();
                if (stats.erro) {
                    conteudo.innerHTML = `<div class="loading" style="color: #ff5252;">Erro: ${stats.detalhe || stats.erro}</div>`;
                    return;
                }
                conteudo.innerHTML = `
                    <div style="text-align: center; margin-bottom: 20px;">
                        <h3 style="font-size: 16px; margin-bottom: 5px;">${stats.timeCasa} x ${stats.timeFora}</h3>
                        <p style="font-size: 24px; font-weight: bold; color: #00e676;">${stats.golsCasa} - ${stats.golsFora}</p>
                    </div>
                    <div class="stat-row"><span class="stat-label">Árbitro</span><span class="stat-value">${stats.arbitro}</span></div>
                    <div class="stat-row"><span class="stat-label">Estádio</span><span class="stat-value">${stats.estadio}</span></div>
                    <div class="stat-row"><span class="stat-label">Público</span><span class="stat-value">${stats.publico}</span></div>
                    <div class="stat-row"><span class="stat-label">Cartões (Casa)</span><span class="stat-value">${stats.cartoesCasa}</span></div>
                    <div class="stat-row"><span class="stat-label">Cartões (Fora)</span><span class="stat-value">${stats.cartoesFora}</span></div>
                    <div class="stat-row"><span class="stat-label">Substituições (Casa)</span><span class="stat-value">${stats.subsCasa}</span></div>
                    <div class="stat-row"><span class="stat-label">Substituições (Fora)</span><span class="stat-value">${stats.subsFora}</span></div>
                    <p style="font-size: 11px; color: #666; margin-top: 15px; text-align: center;">* Dados limitados no plano gratuito da API.</p>
                `;
            } catch (erro) {
                conteudo.innerHTML = '<div class="loading" style="color: #ff5252;">Erro ao carregar.</div>';
            }
        }

        async function abrirTime(event, timeId, nomeTime) {
            event.stopPropagation();
            const modal = document.getElementById('modal-time');
            const conteudo = document.getElementById('conteudo-time');
            const titulo = document.getElementById('titulo-time');
            
            modal.style.display = 'flex';
            titulo.textContent = nomeTime;
            conteudo.innerHTML = '<div class="loading">Buscando últimos jogos...</div>';

            try {
                const resposta = await fetch(`/api/time/${timeId}/jogos`);
                const jogos = await resposta.json();
                if (jogos.erro) {
                    conteudo.innerHTML = `<div class="loading" style="color: #ff5252;">Erro: ${jogos.detalhe || jogos.erro}</div>`;
                    return;
                }
                if (jogos.length === 0) {
                    conteudo.innerHTML = '<div class="loading">Nenhum jogo recente encontrado.</div>';
